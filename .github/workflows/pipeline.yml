name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest tests/
          else
            echo "No hay tests definidos, omitiendo."
          fi

      - name: Build project
        run: |
          echo "Aquí se puede agregar el build o compilación del proyecto"
          # Ejemplo PyInstaller:
          # pyinstaller --onefile src/app.py

      - name: Deploy
        run: |
          echo "Agrega aquí comandos de despliegue (Heroku, Netlify, servidor propio, etc.)"

      - name: Notify
        run: |
          echo "Pipeline completado. Resultado: $GITHUB_WORKFLOW"
